version: '3.8'

services:
  # =============================================
  # PostgreSQL Database
  # =============================================
  postgres:
    image: postgres:16-alpine
    container_name: udyam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: udyam_user
      POSTGRES_PASSWORD: udyam_password
      POSTGRES_DB: udyam_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U udyam_user -d udyam_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - udyam-network

  # =============================================
  # UDYAM Full-Stack Application (Production)
  # =============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: udyam-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://udyam_user:udyam_password@postgres:5432/udyam_db?schema=public"
      JWT_SECRET: "${JWT_SECRET:-udyam_production_jwt_secret_change_this}"
      JWT_EXPIRES_IN: "7d"
    ports:
      - "5000:5000"
    networks:
      - udyam-network

volumes:
  postgres_data:

networks:
  udyam-network:
    driver: bridge
